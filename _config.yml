# Book settings
title: "Portfolio"
author: "Renz"
copyright: "2026"

# Notebooks are displayed as saved (with their existing outputs).
# Run your notebooks in Jupyter first, save them, then build.
execute:
  execute_notebooks: "off"

repository:
  url: https://github.com/RenzWoo/ds-portfolio
  branch: main

html:
  use_repository_button: true
  use_issues_button: false
  use_edit_page_button: false
  comments:
    hypothesis: false

launch_buttons:
  notebook_interface: "classic"

parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - html_image

sphinx:
  extra_extensions:
    - sphinx_design

exclude_patterns:
  - README.md
  - _build
  - .ipynb_checkpoints
