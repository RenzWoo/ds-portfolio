name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Build site (notebooks are shown as saved, not re-run)
        run: myst build --html
      - name: Force dark mode on every page
        run: find _build/html -name '*.html' -exec sed -i 's|<html lang="en" class=""|<html lang="en" class="dark"|' {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
